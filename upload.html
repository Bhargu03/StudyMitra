<div id="upload-page" class="page-content hidden">
    <div class="upload-container glass-card">
        <div class="upload-header">
            <h2><i class="fas fa-cloud-upload-alt"></i> Analyze Exam Papers</h2>
            <p>Upload one or more PDFs to identify high-weightage topics.</p>
        </div>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfUpload').click()">
            <div class="drop-zone-content">
                <i class="fas fa-file-pdf fa-3x"></i>
                <p>Drag & drop PDFs here or <span>Browse Files</span></p>
                <input type="file" id="pdfUpload" accept="application/pdf" multiple hidden onchange="handleFileSelect(event)">
            </div>
        </div>

        <div id="fileList" class="file-list"></div>

        <button class="primary-btn analyze-btn" onclick="analyzePDFs()">
            <i class="fas fa-microchip"></i> Start AI Analysis
        </button>

        <div id="reviewSection" class="review-section hidden">
            <h3><i class="fas fa-list-check"></i> Extracted Topics</h3>
            <p>Adjust weights if necessary before generating your plan.</p>
            <div id="topicsList"></div>
            <button class="secondary-btn" onclick="confirmAndSave()">Confirm & Save Plan</button>
        </div>
    </div>
</div>
