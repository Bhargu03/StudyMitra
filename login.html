<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyMitra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-container glass-card">
        <div class="login-header">
            <h1>StudyMitra</h1>
            <p>Ready to ace your exams?</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label>Enrollment Number</label>
                <input type="text" id="enrollment" placeholder="e.g. 25BT04009" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="main-btn">Sign In</button>
        </form>

        <div class="login-footer">
            <p>New to StudyMitra? <a href="#">Create Account</a></p>
        </div>
    </div>

    <script>
        // Apply saved theme to login page
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }

            function parseStoredUser() {
                const stored = localStorage.getItem('user');
                if (!stored) return null;
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    return { enrollment: stored };
                }
            }

            const existingUser = parseStoredUser();
            if (existingUser && existingUser.enrollment) {
                window.location.href = 'index.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const errorEl = document.createElement('div');
            errorEl.id = 'login-error';
            errorEl.style.color = 'var(--accent)';
            errorEl.style.marginTop = '12px';
            errorEl.style.display = 'none';
            form.appendChild(errorEl);

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const enrollment = document.getElementById('enrollment').value.trim();
                const password = document.getElementById('password').value.trim();

                if (enrollment && password) {
                    const user = {
                        enrollment,
                        password,
                        name: `Student ${enrollment.slice(-4)}`,
                        email: `${enrollment}@studymitra.com`
                    };
                    localStorage.setItem('user', JSON.stringify(user));

                    const profile = {
                        name: user.name,
                        email: user.email,
                        enrollment: user.enrollment,
                        phone: '',
                        course: '',
                        college: '',
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(enrollment)}`
                    };
                    localStorage.setItem('userProfile', JSON.stringify(profile));

                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = 'Please enter both enrollment number and password.';
                    errorEl.style.display = 'block';
                    setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
                }
            });
        });
    </script>

</body>
</html>
